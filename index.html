const key='ncs-info-study-v1';
let state=JSON.parse(localStorage.getItem(key)||'{"attempts":0,"correct":0,"wrong":{}}');
let deck=[],pos=0,locked=false;
const cats=[...new Set(Q.map(x=>x.cat))]; const catSel=document.getElementById('cat');
cats.forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;catSel.appendChild(o)});
function save(){localStorage.setItem(key,JSON.stringify(state));stats()}
function stats(){total.textContent=Q.length;rate.textContent=state.attempts?Math.round(state.correct/state.attempts*100)+'%':'0%';wrongCount.textContent=Object.keys(state.wrong).length}
function start(){let c=catSel.value;deck=Q.map((x,i)=>({...x,id:i})).filter(x=>c==='all'||x.cat===c);let m=mode.value;if(m==='wrong')deck=deck.filter(x=>state.wrong[x.id]);if(m==='random')deck.sort(()=>Math.random()-.5);pos=0;render()}
function render(){locked=false;bar.style.width=(deck.length?pos/deck.length*100:0)+'%';if(!deck.length){card.innerHTML='<div class="empty">복습할 오답이 없습니다. 🎉</div>';return}if(pos>=deck.length){bar.style.width='100%';card.innerHTML='<div class="empty"><b>학습 완료!</b><br><br>다시 시작하거나 오답만 복습해보세요.</div>';return}
let x=deck[pos];card.innerHTML=`<div class="qmeta"><span>${x.cat}</span><span>${pos+1} / ${deck.length}</span></div><div class="question">${x.q}</div><div class="options">${x.opts.map((o,i)=>`<button class="opt" onclick="answer(${i},this)">${'①②③④'[i]} ${o}</button>`).join('')}</div><div class="explain" id="explain"><b>정답 ${'①②③④'[x.ans]}</b><br>${x.exp}</div><button class="primary next" id="next" style="display:none" onclick="nextQ()">다음 문제</button>`}
function answer(i,el){if(locked)return;locked=true;let x=deck[pos],btns=[...document.querySelectorAll('.opt')];btns[x.ans].classList.add('correct');state.attempts++;if(i===x.ans){state.correct++;delete state.wrong[x.id]}else{el.classList.add('wrong');state.wrong[x.id]=true}document.getElementById('explain').classList.add('show');document.getElementById('next').style.display='block';save()}
function nextQ(){pos++;render();window.scrollTo({top:0,behavior:'smooth'})}
function resetStats(){if(confirm('정답률과 오답 기록을 모두 초기화할까요?')){state={attempts:0,correct:0,wrong:{}};save();start()}}
stats();start();
